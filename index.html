<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="妄想貯金">
<meta name="theme-color" content="#11121b">
<meta name="description" content="衝動買いを我慢した金額を記録する妄想貯金アプリ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<title>妄想貯金</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

:root{
  --bg: #11121b;
  --bg-elevated: #191b29;
  --bg-card: #202339;
  --bg-card-hi: #262a47;
  --gold: #e8b85a;
  --gold-bright: #f7d488;
  --gold-dim: rgba(232,184,90,0.16);
  --text: #f1ece0;
  --text-sub: #9b9cb8;
  --text-dim: #63647d;
  --danger: #cf8188;
  --danger-bright: #ef9aa1;
  --success: #93c19a;
  --border: rgba(232,184,90,0.13);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --bg-translucent: rgba(17,18,27,0.88);
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg: #f6efdd;
  --bg-elevated: #fffdf6;
  --bg-card: #fbf3de;
  --bg-card-hi: #f5e6bd;
  --gold: #b8862c;
  --gold-bright: #92640f;
  --gold-dim: rgba(184,134,44,0.14);
  --text: #2a2413;
  --text-sub: #6b5f3f;
  --text-dim: #948757;
  --danger: #b8555f;
  --danger-bright: #973e48;
  --success: #4f7d55;
  --border: rgba(146,100,15,0.18);
  --bg-translucent: rgba(246,239,221,0.9);
  color-scheme: light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    --bg: #f6efdd; --bg-elevated: #fffdf6; --bg-card: #fbf3de; --bg-card-hi: #f5e6bd;
    --gold: #b8862c; --gold-bright: #92640f; --gold-dim: rgba(184,134,44,0.14);
    --text: #2a2413; --text-sub: #6b5f3f; --text-dim: #948757;
    --danger: #b8555f; --danger-bright: #973e48; --success: #4f7d55;
    --border: rgba(146,100,15,0.18); --bg-translucent: rgba(246,239,221,0.9); color-scheme: light;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{
  margin:0; padding:0; height:100%;
  background: radial-gradient(120% 90% at 50% -10%, var(--bg-card-hi) 0%, var(--bg) 55%);
  color: var(--text);
  font-family: 'Zen Maru Gothic', sans-serif;
  overscroll-behavior-y: none;
  transition: background .2s ease, color .2s ease;
}
body{
  padding-top: calc(var(--safe-t) + 14px);
  padding-bottom: calc(var(--safe-b) + 78px);
  min-height: 100vh;
}
.wrap{ max-width: 480px; margin: 0 auto; padding: 0 calc(18px + var(--safe-r)) 0 calc(18px + var(--safe-l)); }

.brand{
  display:flex; align-items:center; gap:8px; margin: 4px 4px 18px;
}
.brand .mark{ font-size: 20px; }
.brand h1{ font-size: 15px; font-weight:700; letter-spacing: 0.04em; margin:0; color: var(--text-sub); flex:1; }
.icon-btn{
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text-sub);
  width: 34px; height: 34px; border-radius: 12px; font-size: 15px;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:active{ transform: scale(0.92); }

/* Hero total */
.hero{
  position: relative;
  border-radius: 26px;
  padding: 30px 22px 26px;
  background: linear-gradient(165deg, var(--bg-card-hi), var(--bg-card) 70%);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 18px;
}
.hero::before{
  content:"";
  position:absolute; right:-40px; top:-60px;
  width:180px; height:180px; border-radius:50%;
  background: radial-gradient(circle, var(--gold-dim), transparent 70%);
  pointer-events:none;
}
.hero .label{ font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
.hero .amount{
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  font-size: 46px;
  line-height: 1.1;
  color: var(--gold-bright);
  text-shadow: 0 0 22px var(--gold-dim);
  display:flex; align-items:flex-start; gap:2px;
}
.hero .amount small{ font-size: 20px; margin-top: 8px; font-family:'Zen Maru Gothic',sans-serif; color: var(--gold);}
.hero .sub{
  margin-top: 12px; display:flex; gap:16px; font-size: 12.5px; color: var(--text-dim);
}
.hero .sub b{ color: var(--text-sub); font-weight:500; font-family:'DM Mono',monospace;}
.hero .equiv{
  margin-top: 14px; padding-top: 12px;
  border-top: 1px dashed var(--border);
  font-size: 13px; color: var(--text-sub);
  line-height: 1.5;
}
.hero .equiv b{ color: var(--gold-bright); font-weight: 700; font-family: inherit; }
.hero .equiv .cnt{ font-family:'DM Mono',monospace; color: var(--gold-bright); }

/* Chips */
.chip-head{ display:flex; align-items:center; margin: 2px 2px 8px; }
.chip-head span{ font-size: 12.5px; color: var(--text-dim); flex:1; }
.chip-head button{
  background:none; border:none; color: var(--text-dim); font-size: 12px; padding: 4px 6px;
}
.chip-head button.on{ color: var(--gold-bright); }
.chip-row{
  display:flex; gap:8px; overflow-x:auto; padding: 2px 2px 14px;
  -ms-overflow-style:none; scrollbar-width:none;
}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  position:relative;
  flex: 0 0 auto;
  display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  padding: 9px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--text);
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 13.5px;
  white-space: nowrap;
  transition: transform .12s ease, background .12s ease;
}
.chip small{ font-family:'DM Mono',monospace; color: var(--gold); font-size: 12px; }
.chip:active{ transform: scale(0.94); background: var(--bg-card-hi); }
.chip .rm{
  position:absolute; top:-7px; right:-7px;
  width:20px; height:20px; border-radius:50%;
  background: var(--danger); color:#fff; border: 2px solid var(--bg);
  font-size: 12px; line-height:1; display:flex; align-items:center; justify-content:center;
}

/* Entry card */
.card{
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 18px;
}
.card h2{
  font-size: 14px; margin: 0 0 12px; color: var(--text-sub); font-weight: 500;
}
.field-row{ display:flex; gap:8px; margin-bottom: 10px; }
input[type=text], input[type=number], input[type=date], input[type=time], select{
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  border-radius: 12px;
  padding: 11px 13px;
  font-size: 15px;
  font-family: 'Zen Maru Gothic', sans-serif;
  outline: none;
  width: 100%;
}
input[type=number]{ font-family:'DM Mono',monospace; }
input:focus, select:focus{ border-color: var(--gold); }
.field-row input[type=text]{ flex: 1.4; }
.field-row input[type=number]{ flex: 1; }
.amt-quick{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 10px; }
.amt-quick button{
  background: var(--bg-card); border:1px solid var(--border); color: var(--text-sub);
  border-radius: 10px; padding: 6px 11px; font-size: 12.5px; font-family:'DM Mono',monospace;
}
.amt-quick button:active{ background: var(--bg-card-hi); }
.cat-row{ display:flex; gap:6px; margin-bottom: 10px; }
.cat-row button{
  flex:1; padding: 8px 4px; border-radius: 10px; border:1px solid var(--border);
  background: var(--bg-card); color: var(--text-sub); font-size: 12px;
  font-family:'Zen Maru Gothic',sans-serif;
}
.cat-row button.sel{ background: var(--gold-dim); border-color: var(--gold); color: var(--gold-bright); }
.toggle-link{
  background:none; border:none; color: var(--text-dim); font-size: 12px; padding: 2px 0 10px;
  text-decoration: underline;
}
.datetime-row{ display:none; gap:8px; margin-bottom: 10px; }
.datetime-row.on{ display:flex; }
.check-row{
  display:flex; align-items:center; gap:8px; font-size: 12.5px; color: var(--text-sub); margin-bottom: 14px;
}
.check-row input{ accent-color: var(--gold); width:15px; height:15px; }
.btn-main{
  width:100%; border:none; border-radius: 14px; padding: 13px;
  background: linear-gradient(160deg, var(--gold-bright), var(--gold));
  color: #201405; font-weight: 700; font-size: 15.5px;
  font-family:'Zen Maru Gothic',sans-serif;
  transition: transform .1s ease;
}
.btn-main:active{ transform: scale(0.97); }

/* History */
.hist h2{ font-size: 14px; color: var(--text-sub); font-weight:500; margin: 4px 4px 10px; }
.hist-item{
  display:flex; align-items:center; gap:10px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--border);
}
.hist-item .cat{ font-size: 15px; flex:0 0 auto; }
.hist-item .body{ flex:1; min-width:0; }
.hist-item .name{ font-size: 14.5px; }
.hist-item .time{ font-size: 11.5px; color: var(--text-dim); }
.hist-item .amt{ font-family:'DM Mono',monospace; color: var(--gold-bright); font-size: 14.5px; }
.hist-item .del{
  background:none; border:none; color: var(--text-dim); font-size: 15px; padding: 4px 6px;
  border-radius: 8px;
}
.hist-item .del.confirm{ color: #fff; background: var(--danger); font-size: 11.5px; padding: 5px 8px; }
.empty{ text-align:center; color: var(--text-dim); font-size: 13.5px; padding: 30px 0; }

/* Stats */
.stat-grid{ display:flex; gap:10px; margin-bottom: 18px; }
.stat-box{
  flex:1; background: var(--bg-elevated); border:1px solid var(--border); border-radius:16px;
  padding: 14px 12px;
}
.stat-box .l{ font-size: 11.5px; color: var(--text-sub); margin-bottom:6px; }
.stat-box .v{ font-family:'DM Mono',monospace; font-size: 19px; color: var(--gold-bright); }
.seg{ display:flex; gap:6px; margin-bottom: 12px; }
.seg button{
  flex:1; padding: 7px 0; border-radius: 10px; border:1px solid var(--border);
  background: var(--bg-card); color: var(--text-sub); font-size: 12.5px;
  font-family:'Zen Maru Gothic',sans-serif;
}
.seg button.sel{ background: var(--gold-dim); border-color: var(--gold); color: var(--gold-bright); }
.chart-card canvas{ width:100%; height: 140px; display:block; }
.rank-item{
  display:flex; align-items:center; gap:10px; padding: 10px 2px; border-bottom: 1px solid var(--border);
}
.rank-item .n{ font-family:'DM Mono',monospace; color: var(--text-dim); font-size:13px; width:16px; }
.rank-item .name{ flex:1; font-size: 14px; }
.rank-item .cnt{ font-size: 11.5px; color: var(--text-dim); margin-right:4px; }
.rank-item .amt{ font-family:'DM Mono',monospace; color: var(--gold); font-size: 13.5px; }
.cat-stat{ display:flex; align-items:center; gap:10px; padding: 9px 2px; }
.cat-stat .name{ width:90px; font-size: 13px; color: var(--text-sub); }
.cat-stat .bar-bg{ flex:1; height:8px; border-radius:5px; background: var(--bg-card); overflow:hidden; }
.cat-stat .bar{ height:100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius:5px; }
.cat-stat .amt{ font-family:'DM Mono',monospace; font-size: 12px; color: var(--text-sub); width:74px; text-align:right; line-height:1.5; }

.goal-bar-bg{ height:10px; border-radius:6px; background: var(--bg-card); overflow:hidden; margin: 4px 0 8px; }
.goal-bar{ height:100%; border-radius:6px; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); transition: width .3s ease; }
.goal-row{ display:flex; justify-content:space-between; font-size: 12.5px; color: var(--text-sub); }
.goal-row b{ color: var(--gold-bright); font-family:'DM Mono',monospace; font-weight:500; }

.backup-row{ display:flex; gap:8px; }
.backup-row button{
  flex:1; padding: 11px; border-radius: 12px; border:1px solid var(--border);
  background: var(--bg-card); color: var(--text-sub); font-size: 13px;
  font-family:'Zen Maru Gothic',sans-serif;
}
.backup-row button:active{ background: var(--bg-card-hi); }
.reset-btn{
  width:100%; margin-top: 10px; padding: 11px; border-radius: 12px;
  border: 1px solid rgba(207,129,136,0.35); background: transparent;
  color: var(--danger-bright); font-size: 13px; font-family:'Zen Maru Gothic',sans-serif;
}
.reset-btn:active{ background: rgba(207,129,136,0.1); }

/* Tabs */
.tabbar{
  position: fixed; left:0; right:0; bottom:0;
  padding-bottom: var(--safe-b);
  padding-left: var(--safe-l); padding-right: var(--safe-r);
  background: var(--bg-translucent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  display:flex;
}
body.modal-open{ overflow: hidden; }
.tabbar button{
  flex:1; background:none; border:none; padding: 12px 0 10px;
  color: var(--text-dim); font-family:'Zen Maru Gothic',sans-serif; font-size: 12.5px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.tabbar button .ic{ font-size: 19px; }
.tabbar button.active{ color: var(--gold-bright); }

.view{ display:none; }
.view.active{ display:block; animation: fadein .18s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

/* toast */
.toast{
  position: fixed; left:50%; top: calc(var(--safe-t) + 14px);
  transform: translate(-50%, -30px);
  background: var(--bg-card-hi);
  border: 1px solid var(--gold);
  color: var(--gold-bright);
  padding: 10px 18px;
  border-radius: 14px;
  font-size: 13.5px;
  opacity:0;
  pointer-events:none;
  transition: all .28s cubic-bezier(.2,.9,.3,1.2);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  white-space: nowrap;
  z-index: 50;
}
.toast.show{ opacity:1; transform: translate(-50%, 0); }

/* modal */
.modal-bg{
  position: fixed; inset:0; background: rgba(0,0,0,0.55);
  display:none; align-items:flex-end; justify-content:center; z-index: 80;
}
.modal-bg.show{ display:flex; }
.modal{
  width:100%; max-width: 480px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 22px 22px 0 0;
  padding: 20px 20px calc(20px + var(--safe-b));
  animation: slideup .2s ease;
}
@keyframes slideup{ from{ transform: translateY(30px); opacity:0; } to{ transform:none; opacity:1; } }
.modal h2{ font-size: 15px; margin: 0 0 14px; color: var(--text-sub); font-weight:600; }
.modal-actions{ display:flex; gap:8px; margin-top: 6px; }
.modal-actions .btn-main{ flex:2; }
.modal-actions .btn-del{
  flex:1; border:1px solid var(--border); border-radius:14px; background: var(--bg-card);
  color: var(--danger-bright); font-family:'Zen Maru Gothic',sans-serif; font-size: 14px;
}
.swatch-grid{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom: 6px; }
.swatch{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  background:none; border:none; color: var(--text-sub); font-size: 11.5px;
  font-family:'Zen Maru Gothic',sans-serif; padding: 4px;
}
.swatch .dot{ width:40px; height:40px; border-radius:50%; border: 2px solid transparent; }
.swatch.sel .dot{ border-color: var(--text); }
.swatch.sel{ color: var(--text); font-weight:700; }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <span class="mark">🪙</span>
    <h1>妄想貯金</h1>
    <button class="icon-btn" id="btnPalette" title="配色を変える">🎨</button>
    <button class="icon-btn" id="btnTheme" title="表示切替">🌓</button>
  </div>

  <!-- 記録 VIEW -->
  <div class="view active" id="view-record">
    <div class="hero">
      <div class="label">これまでの妄想貯金額</div>
      <div class="amount">¥<span id="totalAmount">0</span></div>
      <div class="sub">今月 <b id="monthAmount">¥0</b> ・ 連続<b id="streakDays">0</b>日</div>
      <div class="equiv" id="equivLine"></div>
    </div>

    <div class="chip-head">
      <span>よく我慢するもの</span>
      <button id="btnChipEdit">編集</button>
    </div>
    <div class="chip-row" id="chipRow"></div>

    <div class="card">
      <h2>何を我慢した?</h2>
      <div class="field-row">
        <input type="text" id="inputName" placeholder="缶ジュース" maxlength="20">
        <input type="number" id="inputAmount" placeholder="130" inputmode="numeric" pattern="[0-9]*" min="1">
      </div>
      <div class="amt-quick" id="amtQuick"></div>
      <div class="cat-row" id="catRow"></div>
      <button class="toggle-link" id="btnDateToggle">📅 日時を指定する</button>
      <div class="datetime-row" id="datetimeRow">
        <input type="date" id="inputDate">
        <input type="time" id="inputTime">
      </div>
      <label class="check-row">
        <input type="checkbox" id="inputFav">
        よく我慢するものとして登録する
      </label>
      <button class="btn-main" id="btnAdd">我慢した!</button>
    </div>

    <div class="hist">
      <h2>最近の記録(タップで編集)</h2>
      <div class="cat-row" id="histFilterRow" style="margin-bottom:12px;"></div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- 統計 VIEW -->
  <div class="view" id="view-stats">
    <div class="stat-grid">
      <div class="stat-box"><div class="l">今週</div><div class="v" id="statWeek">¥0</div></div>
      <div class="stat-box"><div class="l">今月</div><div class="v" id="statMonth">¥0</div></div>
      <div class="stat-box"><div class="l">全期間</div><div class="v" id="statAll">¥0</div></div>
    </div>

    <div class="card">
      <h2>🎯 今月の目標</h2>
      <div id="goalDisplay"></div>
      <div class="field-row" style="margin-top:10px;">
        <input type="number" id="goalInput" placeholder="例: 3000" inputmode="numeric" pattern="[0-9]*" min="0">
        <button id="btnGoalSave" style="flex:0 0 auto; padding:0 16px; border-radius:12px; border:1px solid var(--border); background:var(--bg-card); color:var(--gold-bright); font-family:'Zen Maru Gothic',sans-serif; font-size:13.5px;">設定</button>
      </div>
    </div>

    <div class="card chart-card">
      <h2>推移</h2>
      <div class="seg" id="chartSeg">
        <button data-range="14" class="sel">14日間</button>
        <button data-range="30">30日間</button>
        <button data-range="month">月別</button>
      </div>
      <canvas id="chart" width="600" height="280"></canvas>
    </div>

    <div class="card">
      <h2>カテゴリ別</h2>
      <div id="catStatList"></div>
    </div>

    <div class="card">
      <h2>我慢ランキング</h2>
      <div id="rankList"></div>
    </div>

    <div class="card">
      <h2>バックアップ</h2>
      <div class="backup-row">
        <button id="btnExport">⬇ 書き出し</button>
        <button id="btnImport">⬆ 読み込み</button>
      </div>
      <input type="file" id="fileImport" accept="application/json" style="display:none">
      <button class="reset-btn" id="btnResetAll">🗑 すべてリセット</button>
    </div>
  </div>
</div>

<div class="tabbar">
  <button class="active" data-tab="record"><span class="ic">🥤</span>記録</button>
  <button data-tab="stats"><span class="ic">📊</span>統計</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

<script>
const STORAGE_KEY = 'mousou-chokin-v2';
const THEME_KEY = 'mousou-chokin-theme';

const CATEGORIES = [
  {id:'food', label:'🍙 飲食'},
  {id:'dtm',  label:'🎹 DTM'},
  {id:'ent',  label:'🎬 娯楽'},
  {id:'other',label:'🛍️ その他'},
];
function catLabel(id){ const c = CATEGORIES.find(c=>c.id===id); return c ? c.label : CATEGORIES[3].label; }
function catEmoji(id){ return catLabel(id).split(' ')[0]; }

function migrateFromV1(){
  try{
    const raw = localStorage.getItem('mousou-chokin-v1');
    if(!raw) return null;
    const old = JSON.parse(raw);
    return {
      entries: (old.entries||[]).map(e=>({...e, category: e.category || 'other'})),
      frequent: (old.frequent||[]).map(f=>({...f, category: f.category || 'other', count: f.count || 0})),
    };
  }catch(e){ return null; }
}

function defaultData(){
  return {
    entries: [],
    frequent: [
      {name:'缶ジュース', amount:130, category:'food', count:0},
      {name:'コンビニコーヒー', amount:150, category:'food', count:0},
      {name:'コンビニスイーツ', amount:250, category:'food', count:0}
    ],

  };
}

function loadData(){
  let d = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) d = JSON.parse(raw);
  }catch(e){}
  if(!d) d = migrateFromV1();
  if(!d) d = defaultData();
  if(!d.settings) d.settings = { monthlyGoal: null };
  if(!Array.isArray(d.entries)) d.entries = [];
  if(!Array.isArray(d.frequent)) d.frequent = [];
  return d;
}
let data = loadData();
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }catch(e){
    showToast('保存に失敗しました(空き容量不足の可能性)');
    return false;
  }
}

function equivText(total){
  if(total <= 0) return 'まずは1件、記録してみよう';
  const smallest = EQUIV_ITEMS[0];
  if(total < smallest.price){
    return `<b>${smallest.name}</b>まであと<span class="cnt">¥${yen(smallest.price - total)}</span>`;
  }
  let tierIdx = 0;
  for(let i=0;i<EQUIV_ITEMS.length;i++){
    if(EQUIV_ITEMS[i].price <= total) tierIdx = i; else break;
  }
  // 近い価格帯の候補からランダムに選び、毎回の見え方に変化を持たせる
  const tierPrice = EQUIV_ITEMS[tierIdx].price;
  const pool = EQUIV_ITEMS.filter(it => it.price <= total && it.price >= tierPrice * 0.55);
  const pick = pool[Math.floor(Math.random() * pool.length)] || EQUIV_ITEMS[tierIdx];
  const count = Math.floor(total / pick.price);
  return `これは <b>${pick.name}</b> <span class="cnt">${yen(count)}${pick.unit}</span> 相当`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function computeStreak(){
  const daySet = new Set(data.entries.map(e=>startOfDay(e.ts)));
  let streak = 0;
  let cursor = startOfDay(Date.now());
  if(!daySet.has(cursor)) cursor -= 86400000;
  while(daySet.has(cursor)){
    streak++;
    cursor -= 86400000;
  }
  return streak;
}

function drawChart(){
  const canvas = document.getElementById('chart');
  const ctx = canvas && canvas.getContext && canvas.getContext('2d');
  if(!ctx) return;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  let buckets = [];
  let labelEvery = 2;
  if(chartRange === 'month'){
    const map = {};
    data.entries.forEach(e=>{
      const d = new Date(e.ts);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      map[key] = (map[key]||0) + e.amount;
    });
    const keys = Object.keys(map).sort().slice(-12);
    buckets = keys.map(k=>({label:k.slice(2).replace('-','/'), sum: map[k]}));
    labelEvery = 1;
  } else {
    const days = chartRange === '30' ? 30 : 14;
    labelEvery = days === 30 ? 5 : 2;
    for(let i=days-1; i>=0; i--){
      const start = daysAgo(i);
      const end = start + 86400000;
      const sum = data.entries.filter(e=>e.ts>=start && e.ts<end).reduce((s,e)=>s+e.amount,0);
      const d = new Date(start);
      buckets.push({label:`${d.getMonth()+1}/${d.getDate()}`, sum});
    }
  }
  if(buckets.length === 0) return;

  const max = Math.max(...buckets.map(b=>b.sum), 1);
  const padL = 6, padR = 6, padT = 14, padB = 24;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const barGap = 6;
  const barW = (chartW - barGap*(buckets.length-1)) / buckets.length;

  buckets.forEach((b, i)=>{
    const h = b.sum === 0 ? 2 : Math.max(4, (b.sum / max) * chartH);
    const x = padL + i*(barW+barGap);
    const y = padT + (chartH - h);
    const grad = ctx.createLinearGradient(0,y,0,y+h);
    grad.addColorStop(0, '#f7d488');
    grad.addColorStop(1, '#c98f3f');
    ctx.fillStyle = b.sum === 0 ? 'rgba(155,156,184,0.25)' : grad;
    roundRect(ctx, x, y, barW, h, 4);
    ctx.fill();

    if(i % labelEvery === 0){
      ctx.fillStyle = 'rgba(155,156,184,0.7)';
      ctx.font = '10px "DM Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(b.label, x+barW/2, H-8);
    }
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function renderRanking(){
  const list = document.getElementById('rankList');
  list.innerHTML = '';
  const map = {};
  data.entries.forEach(e=>{
    if(!map[e.name]) map[e.name] = {count:0, sum:0, catCounts:{}};
    map[e.name].count++;
    map[e.name].sum += e.amount;
    const c = e.category || 'other';
    map[e.name].catCounts[c] = (map[e.name].catCounts[c]||0) + 1;
  });
  const arr = Object.entries(map).map(([name, v])=>{
    const topCat = Object.entries(v.catCounts).sort((a,b)=>b[1]-a[1])[0][0];
    return {name, topCat, ...v};
  }).sort((a,b)=>b.sum-a.sum).slice(0,10);
  if(arr.length === 0){
    list.innerHTML = '<div class="empty">記録が増えるとランキングが出てきます</div>';
    return;
  }
  arr.forEach((r, i)=>{
    const row = document.createElement('div');
    row.className = 'rank-item';
    row.innerHTML = `
      <span class="n">${i+1}</span>
      <span class="name">${catEmoji(r.topCat)} ${escapeHtml(r.name)}</span>
      <span class="cnt">×${r.count}</span>
      <span class="amt">¥${yen(r.sum)}</span>
    `;
    list.appendChild(row);
  });
}

function renderCatStats(total){
  const list = document.getElementById('catStatList');
  list.innerHTML = '';
  const map = {};
  CATEGORIES.forEach(c=> map[c.id] = {sum:0, count:0});
  data.entries.forEach(e=>{
    const key = e.category || 'other';
    if(!map[key]) map[key] = {sum:0, count:0};
    map[key].sum += e.amount;
    map[key].count++;
  });
  const max = Math.max(...Object.values(map).map(v=>v.sum), 1);
  if(total === 0){
    list.innerHTML = '<div class="empty">記録が増えると内訳が出てきます</div>';
    return;
  }
  CATEGORIES.forEach(c=>{
    const v = map[c.id] || {sum:0, count:0};
    const row = document.createElement('div');
    row.className = 'cat-stat';
    row.innerHTML = `
      <span class="name">${c.label}</span>
      <span class="bar-bg"><span class="bar" style="width:${(v.sum/max*100).toFixed(0)}%"></span></span>
      <span class="amt">¥${yen(v.sum)}<br><span style="color:var(--text-dim); font-size:10.5px;">${v.count}件</span></span>
    `;
    list.appendChild(row);
  });
}

/* ---------- backup: export / import ---------- */
document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `mousou-chokin-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('バックアップを書き出しました');
});

document.getElementById('btnImport').addEventListener('click', ()=>{
  document.getElementById('fileImport').click();
});
document.getElementById('fileImport').addEventListener('change', (ev)=>{
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const imported = JSON.parse(reader.result);
      if(!imported || !Array.isArray(imported.entries)) throw new Error('invalid');

      const validCatIds = new Set(CATEGORIES.map(c=>c.id));
      const existingIds = new Set(data.entries.map(e=>e.id));
      let skipped = 0;
      const validEntries = [];
      imported.entries.forEach(e=>{
        const name = typeof e?.name === 'string' ? e.name.trim().slice(0,40) : '';
        const amount = Number(e?.amount);
        const ts = Number(e?.ts);
        const id = typeof e?.id === 'string' && e.id ? e.id : (Date.now()+Math.random().toString(16).slice(2));
        if(!name || !Number.isFinite(amount) || amount <= 0 || !Number.isFinite(ts) || ts <= 0){
          skipped++;
          return;
        }
        if(existingIds.has(id)) return; // 重複はスキップ(件数に含めない)
        validEntries.push({
          id, name, amount,
          category: validCatIds.has(e?.category) ? e.category : 'other',
          ts,
        });
      });

      const validFrequent = [];
      const existingFreq = new Set(data.frequent.map(f=>f.name));
      (Array.isArray(imported.frequent) ? imported.frequent : []).forEach(f=>{
        const name = typeof f?.name === 'string' ? f.name.trim().slice(0,40) : '';
        const amount = Number(f?.amount);
        if(!name || !Number.isFinite(amount) || amount <= 0) return;
        if(existingFreq.has(name)) return;
        existingFreq.add(name);
        validFrequent.push({
          name, amount,
          category: validCatIds.has(f?.category) ? f.category : 'other',
          count: Number.isFinite(Number(f?.count)) ? Number(f.count) : 0,
        });
      });

      if(imported.settings && Number.isFinite(Number(imported.settings.monthlyGoal)) && Number(imported.settings.monthlyGoal) > 0 && !data.settings.monthlyGoal){
        data.settings.monthlyGoal = Number(imported.settings.monthlyGoal);
      }

      data.entries = data.entries.concat(validEntries);
      data.frequent = data.frequent.concat(validFrequent);
      save();
      renderAll();
      showToast(skipped > 0 ? `${validEntries.length}件を読み込み(${skipped}件はスキップ)` : `${validEntries.length}件を読み込みました`);
    }catch(e){
      showToast('読み込みに失敗しました(ファイル形式を確認してください)');
    }
    ev.target.value = '';
  };
  reader.readAsText(file);
});

function resolvedMode(){
  const t = localStorage.getItem(THEME_KEY) || 'system';
  if(t === 'light' || t === 'dark') return t;
  try{
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  }catch(e){}
  return 'dark';
}

function applyPalette(){
  try{
    const id = localStorage.getItem(PALETTE_KEY) || 'gold';
    const p = (PALETTES[id] || PALETTES.gold)[resolvedMode()];
    const root = document.documentElement.style;
    root.setProperty('--bg', p.bg);
    root.setProperty('--bg-elevated', p.bgElevated);
    root.setProperty('--bg-card', p.bgCard);
    root.setProperty('--bg-card-hi', p.bgCardHi);
    root.setProperty('--border', p.border);
    root.setProperty('--bg-translucent', p.translucent);
    root.setProperty('--gold', p.gold);
    root.setProperty('--gold-bright', p.bright);
    root.setProperty('--gold-dim', p.dim);
  }catch(e){}
}

function applyTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY) || 'system';
    if(t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
  applyPalette();
}
document.getElementById('btnTheme').addEventListener('click', ()=>{
  const cur = localStorage.getItem(THEME_KEY) || 'system';
  const next = cur === 'system' ? 'dark' : (cur === 'dark' ? 'light' : 'system');
  localStorage.setItem(THEME_KEY, next);
  applyTheme();
  showToast(next === 'system' ? 'システム設定に合わせる' : (next === 'dark' ? 'ダークモード' : 'ライトモード'));
});
try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{
      if((localStorage.getItem(THEME_KEY) || 'system') === 'system') applyPalette();
    });
  }
}catch(e){}
document.getElementById('btnPalette').addEventListener('click', ()=>{
  const cur = localStorage.getItem(PALETTE_KEY) || 'gold';
  modalBody.innerHTML = `<h2>配色を選ぶ</h2><div class="swatch-grid" id="swatchGrid"></div>`;
  const grid = modalBody.querySelector('#swatchGrid');
  Object.entries(PALETTES).forEach(([id, p])=>{
    const b = document.createElement('button');
    b.className = 'swatch' + (id === cur ? ' sel' : '');
    b.innerHTML = `<span class="dot" style="background: conic-gradient(${p.dark.gold} 0deg 180deg, ${p.dark.bg} 180deg 360deg);"></span>${p.label}`;

});
