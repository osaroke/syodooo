<title>妄想貯金</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

:root{
  --bg: #11121b;
  --bg-elevated: #191b29;
  --bg-card: #202339;
  --bg-card-hi: #262a47;
  --gold: #e8b85a;
  --gold-bright: #f7d488;
  --gold-dim: rgba(232,184,90,0.16);
  --text: #f1ece0;
  --text-sub: #9b9cb8;
  --text-dim: #63647d;
  --danger: #cf8188;
  --danger-bright: #ef9aa1;
  --success: #93c19a;
  --border: rgba(232,184,90,0.13);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --bg-translucent: rgba(17,18,27,0.88);
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg: #f6efdd;
  --bg-elevated: #fffdf6;
  --bg-card: #fbf3de;
  --bg-card-hi: #f5e6bd;
  --gold: #b8862c;
  --gold-bright: #92640f;
  --gold-dim: rgba(184,134,44,0.14);
  --text: #2a2413;
  --text-sub: #6b5f3f;
  --text-dim: #948757;
  --danger: #b8555f;
  --danger-bright: #973e48;
  --success: #4f7d55;
  --border: rgba(146,100,15,0.18);
  --bg-translucent: rgba(246,239,221,0.9);
  color-scheme: light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    --bg: #f6efdd; --bg-elevated: #fffdf6; --bg-card: #fbf3de; --bg-card-hi: #f5e6bd;
    --gold: #b8862c; --gold-bright: #92640f; --gold-dim: rgba(184,134,44,0.14);
    --text: #2a2413; --text-sub: #6b5f3f; --text-dim: #948757;
    --danger: #b8555f; --danger-bright: #973e48; --success: #4f7d55;
    --border: rgba(146,100,15,0.18); --bg-translucent: rgba(246,239,221,0.9); color-scheme: light;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{
  margin:0; padding:0; height:100%;
  background: radial-gradient(120% 90% at 50% -10%, var(--bg-card-hi) 0%, var(--bg) 55%);
  color: var(--text);
  font-family: 'Zen Maru Gothic', sans-serif;
  overscroll-behavior-y: none;
  transition: background .2s ease, color .2s ease;
}
body{
  padding-top: calc(var(--safe-t) + 14px);
  padding-bottom: calc(var(--safe-b) + 78px);
  min-height: 100vh;
}
.wrap{ max-width: 480px; margin: 0 auto; padding: 0 calc(18px + var(--safe-r)) 0 calc(18px + var(--safe-l)); }

.brand{
  display:flex; align-items:center; gap:8px; margin: 4px 4px 18px;
}
.brand .mark{ font-size: 20px; }
.brand h1{ font-size: 15px; font-weight:700; letter-spacing: 0.04em; margin:0; color: var(--text-sub); flex:1; }
.icon-btn{
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text-sub);
  width: 34px; height: 34px; border-radius: 12px; font-size: 15px;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:active{ transform: scale(0.92); }

/* Hero total */
.hero{
  position: relative;
  border-radius: 26px;
  padding: 30px 22px 26px;
  background: linear-gradient(165deg, var(--bg-card-hi), var(--bg-card) 70%);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 18px;
}
.hero::before{
  content:"";
  position:absolute; right:-40px; top:-60px;
  width:180px; height:180px; border-radius:50%;
  background: radial-gradient(circle, var(--gold-dim), transparent 70%);
  pointer-events:none;
}
.hero .label{ font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
.hero .amount{
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  font-size: 46px;
  line-height: 1.1;
  color: var(--gold-bright);
  text-shadow: 0 0 22px var(--gold-dim);
  display:flex; align-items:flex-start; gap:2px;
}
.hero .amount small{ font-size: 20px; margin-top: 8px; font-family:'Zen Maru Gothic',sans-serif; color: var(--gold);}
.hero .sub{
  margin-top: 12px; display:flex; gap:16px; font-size: 12.5px; color: var(--text-dim);
}
.hero .sub b{ color: var(--text-sub); font-weight:500; font-family:'DM Mono',monospace;}
.hero .equiv{
  margin-top: 14px; padding-top: 12px;
  border-top: 1px dashed var(--border);
  font-size: 13px; color: var(--text-sub);
  line-height: 1.5;
}
.hero .equiv b{ color: var(--gold-bright); font-weight: 700; font-family: inherit; }
.hero .equiv .cnt{ font-family:'DM Mono',monospace; color: var(--gold-bright); }

/* Chips */
.chip-head{ display:flex; align-items:center; margin: 2px 2px 8px; }
.chip-head span{ font-size: 12.5px; color: var(--text-dim); flex:1; }
.chip-head button{
  background:none; border:none; color: var(--text-dim); font-size: 12px; padding: 4px 6px;
}
.chip-head button.on{ color: var(--gold-bright); }
.chip-row{
  display:flex; gap:8px; overflow-x:auto; padding: 2px 2px 14px;
  -ms-overflow-style:none; scrollbar-width:none;
}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  position:relative;
  flex: 0 0 auto;
  display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  padding: 9px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--text);
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 13.5px;
  white-space: nowrap;
  transition: transform .12s ease, background .12s ease;
}
.chip small{ font-family:'DM Mono',monospace; color: var(--gold); font-size: 12px; }
.chip:active{ transform: scale(0.94); background: var(--bg-card-hi); }
.chip .rm{
  position:absolute; top:-7px; right:-7px;
  width:20px; height:20px; border-radius:50%;
  background: var(--danger); color:#fff; border: 2px solid var(--bg);
  font-size: 12px; line-height:1; display:flex; align-items:center; justify-content:center;
}

/* Entry card */
.card{
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 18px;
}
.card h2{
  font-size: 14px; margin: 0 0 12px; color: var(--text-sub); font-weight: 500;
}
.field-row{ display:flex; gap:8px; margin-bottom: 10px; }
input[type=text], input[type=number], input[type=date], input[type=time], select{
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  border-radius: 12px;
  padding: 11px 13px;
  font-size: 15px;
  font-family: 'Zen Maru Gothic', sans-serif;
  outline: none;
  width: 100%;
}
input[type=number]{ font-family:'DM Mono',monospace; }
input:focus, select:focus{ border-color: var(--gold); }
.field-row input[type=text]{ flex: 1.4; }
.field-row input[type=number]{ flex: 1; }
.amt-quick{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 10px; }
.amt-quick button{
  background: var(--bg-card); border:1px solid var(--border); color: var(--text-sub);
  border-radius: 10px; padding: 6px 11px; font-size: 12.5px; font-family:'DM Mono',monospace;
}
.amt-quick button:active{ background: var(--bg-card-hi); }
.cat-row{ display:flex; gap:6px; margin-bottom: 10px; }
.cat-row button{
  flex:1; padding: 8px 4px; border-radius: 10px; border:1px solid var(--border);
  background: var(--bg-card); color: var(--text-sub); font-size: 12px;

<script>
const STORAGE_KEY = 'mousou-chokin-v2';
const THEME_KEY = 'mousou-chokin-theme';

const CATEGORIES = [
  {id:'food', label:'🍙 飲食'},
  {id:'dtm',  label:'🎹 DTM'},
  {id:'ent',  label:'🎬 娯楽'},
  {id:'other',label:'🛍️ その他'},
];
function catLabel(id){ const c = CATEGORIES.find(c=>c.id===id); return c ? c.label : CATEGORIES[3].label; }
function catEmoji(id){ return catLabel(id).split(' ')[0]; }

function migrateFromV1(){
  try{
    const raw = localStorage.getItem('mousou-chokin-v1');
    if(!raw) return null;
    const old = JSON.parse(raw);
    return {
      entries: (old.entries||[]).map(e=>({...e, category: e.category || 'other'})),
      frequent: (old.frequent||[]).map(f=>({...f, category: f.category || 'other', count: f.count || 0})),
    };
  }catch(e){ return null; }
}

function defaultData(){
  return {
    entries: [],
    frequent: [
      {name:'缶ジュース', amount:130, category:'food', count:0},
      {name:'コンビニコーヒー', amount:150, category:'food', count:0},
      {name:'コンビニスイーツ', amount:250, category:'food', count:0}
    ],
    settings: { monthlyGoal: null }
  };
}

function loadData(){
  let d = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) d = JSON.parse(raw);
  }catch(e){}
  if(!d) d = migrateFromV1();
  if(!d) d = defaultData();
  if(!d.settings) d.settings = { monthlyGoal: null };
  if(!Array.isArray(d.entries)) d.entries = [];
  if(!Array.isArray(d.frequent)) d.frequent = [];
  return d;
}
let data = loadData();
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }catch(e){
    showToast('保存に失敗しました(空き容量不足の可能性)');
    return false;
  }
}

function yen(n){ return Math.round(n).toLocaleString('ja-JP'); }
function startOfDay(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function daysAgo(n){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return d.getTime(); }

/* ---------- 金額換算(〇〇相当) ---------- */

];

function equivText(total){
  if(total <= 0) return 'まずは1件、記録してみよう';
  const smallest = EQUIV_ITEMS[0];
  if(total < smallest.price){
    return `<b>${smallest.name}</b>まであと<span class="cnt">¥${yen(smallest.price - total)}</span>`;
  }
  let tierIdx = 0;
  for(let i=0;i<EQUIV_ITEMS.length;i++){
    if(EQUIV_ITEMS[i].price <= total) tierIdx = i; else break;
  }
  // 近い価格帯の候補からランダムに選び、毎回の見え方に変化を持たせる
  const tierPrice = EQUIV_ITEMS[tierIdx].price;
  const pool = EQUIV_ITEMS.filter(it => it.price <= total && it.price >= tierPrice * 0.55);
  const pick = pool[Math.floor(Math.random() * pool.length)] || EQUIV_ITEMS[tierIdx];
  const count = Math.floor(total / pick.price);
  return `これは <b>${pick.name}</b> <span class="cnt">${yen(count)}${pick.unit}</span> 相当`;
}

/* ---------- rendering: record view ---------- */
function renderChips(){
  const row = document.getElementById('chipRow');
  row.innerHTML = '';
  const sorted = [...data.frequent].sort((a,b)=> (b.count||0) - (a.count||0));
  sorted.forEach((f)=>{
    const c = document.createElement('button');
    c.className = 'chip';
    c.innerHTML = `${catEmoji(f.category)} ${f.name}<small>¥${yen(f.amount)}</small>`;
    if(chipEditMode){
      const rm = document.createElement('span');
      rm.className = 'rm';
      rm.textContent = '×';
      rm.addEventListener('click', (ev)=>{ ev.stopPropagation(); removeFrequent(f.name); });
      c.appendChild(rm);
      c.addEventListener('click', ()=>{});
    } else {
      c.addEventListener('click', ()=> quickAdd(f));
    }
    row.appendChild(c);
  });
}

let chipEditMode = false;
document.getElementById('btnChipEdit').addEventListener('click', ()=>{
  chipEditMode = !chipEditMode;
  document.getElementById('btnChipEdit').classList.toggle('on', chipEditMode);
  document.getElementById('btnChipEdit').textContent = chipEditMode ? '完了' : '編集';
  renderChips();

  if(sorted.length === 0){

      : '<div class="empty">このカテゴリの記録はまだありません。</div>';

    row.innerHTML = `
      <span class="cat">${catEmoji(e.category || 'other')}</span>
      <span class="body">
        <div class="name">${escapeHtml(e.name)}</div>
        <div class="time">${timeStr}</div>

    `;
    row.querySelector('.body').addEventListener('click', ()=> openEditModal(e.id));
    row.querySelector('.del').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      if(pendingDeleteId === e.id){
        removeEntry(e.id);
        pendingDeleteId = null;
      } else {
        pendingDeleteId = e.id;
        renderHistory();
        setTimeout(()=>{ if(pendingDeleteId === e.id){ pendingDeleteId = null; renderHistory(); } }, 3000);
      }
    });
    list.appendChild(row);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function computeStreak(){
  const daySet = new Set(data.entries.map(e=>startOfDay(e.ts)));
  let streak = 0;
  let cursor = startOfDay(Date.now());
  if(!daySet.has(cursor)) cursor -= 86400000;
  while(daySet.has(cursor)){
    streak++;
    cursor -= 86400000;
  }
  return streak;
}

function drawChart(){
  const canvas = document.getElementById('chart');
  const ctx = canvas && canvas.getContext && canvas.getContext('2d');
  if(!ctx) return;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  let buckets = [];
  let labelEvery = 2;
  if(chartRange === 'month'){
    const map = {};
    data.entries.forEach(e=>{
      const d = new Date(e.ts);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      map[key] = (map[key]||0) + e.amount;
    });
    const keys = Object.keys(map).sort().slice(-12);
    buckets = keys.map(k=>({label:k.slice(2).replace('-','/'), sum: map[k]}));
    labelEvery = 1;
  } else {
    const days = chartRange === '30' ? 30 : 14;
    labelEvery = days === 30 ? 5 : 2;
    for(let i=days-1; i>=0; i--){
      const start = daysAgo(i);
      const end = start + 86400000;
      const sum = data.entries.filter(e=>e.ts>=start && e.ts<end).reduce((s,e)=>s+e.amount,0);
      const d = new Date(start);
      buckets.push({label:`${d.getMonth()+1}/${d.getDate()}`, sum});
    }
  }
  if(buckets.length === 0) return;

  const max = Math.max(...buckets.map(b=>b.sum), 1);
  const padL = 6, padR = 6, padT = 14, padB = 24;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const barGap = 6;
  const barW = (chartW - barGap*(buckets.length-1)) / buckets.length;

  buckets.forEach((b, i)=>{
    const h = b.sum === 0 ? 2 : Math.max(4, (b.sum / max) * chartH);
    const x = padL + i*(barW+barGap);
    const y = padT + (chartH - h);
    const grad = ctx.createLinearGradient(0,y,0,y+h);
    grad.addColorStop(0, '#f7d488');
    grad.addColorStop(1, '#c98f3f');
    ctx.fillStyle = b.sum === 0 ? 'rgba(155,156,184,0.25)' : grad;
    roundRect(ctx, x, y, barW, h, 4);
    ctx.fill();

    if(i % labelEvery === 0){
      ctx.fillStyle = 'rgba(155,156,184,0.7)';
      ctx.font = '10px "DM Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(b.label, x+barW/2, H-8);
    }
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function renderRanking(){
  const list = document.getElementById('rankList');
  list.innerHTML = '';
  const map = {};
  data.entries.forEach(e=>{
    if(!map[e.name]) map[e.name] = {count:0, sum:0, catCounts:{}};
    map[e.name].count++;
    map[e.name].sum += e.amount;
    const c = e.category || 'other';
    map[e.name].catCounts[c] = (map[e.name].catCounts[c]||0) + 1;
  });
  const arr = Object.entries(map).map(([name, v])=>{
    const topCat = Object.entries(v.catCounts).sort((a,b)=>b[1]-a[1])[0][0];
    return {name, topCat, ...v};
  }).sort((a,b)=>b.sum-a.sum).slice(0,10);
  if(arr.length === 0){
    list.innerHTML = '<div class="empty">記録が増えるとランキングが出てきます</div>';
    return;
  }
  arr.forEach((r, i)=>{
    const row = document.createElement('div');
    row.className = 'rank-item';
    row.innerHTML = `
      <span class="n">${i+1}</span>
      <span class="name">${catEmoji(r.topCat)} ${escapeHtml(r.name)}</span>
      <span class="cnt">×${r.count}</span>
      <span class="amt">¥${yen(r.sum)}</span>
    `;
    list.appendChild(row);
  });
}

function renderCatStats(total){
  const list = document.getElementById('catStatList');
  list.innerHTML = '';
  const map = {};
  CATEGORIES.forEach(c=> map[c.id] = {sum:0, count:0});
  data.entries.forEach(e=>{
    const key = e.category || 'other';
    if(!map[key]) map[key] = {sum:0, count:0};
    map[key].sum += e.amount;
    map[key].count++;
  });
  const max = Math.max(...Object.values(map).map(v=>v.sum), 1);

  }
  CATEGORIES.forEach(c=>{
    const v = map[c.id] || {sum:0, count:0};

    row.className = 'cat-stat';
    row.innerHTML = `

document.getElementById('btnImport').addEventListener('click', ()=>{
  document.getElementById('fileImport').click();
});
document.getElementById('fileImport').addEventListener('change', (ev)=>{
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const imported = JSON.parse(reader.result);
      if(!imported || !Array.isArray(imported.entries)) throw new Error('invalid');

      const validCatIds = new Set(CATEGORIES.map(c=>c.id));
      const existingIds = new Set(data.entries.map(e=>e.id));
      let skipped = 0;
      const validEntries = [];
      imported.entries.forEach(e=>{
        const name = typeof e?.name === 'string' ? e.name.trim().slice(0,40) : '';
        const amount = Number(e?.amount);
        const ts = Number(e?.ts);
        const id = typeof e?.id === 'string' && e.id ? e.id : (Date.now()+Math.random().toString(16).slice(2));
        if(!name || !Number.isFinite(amount) || amount <= 0 || !Number.isFinite(ts) || ts <= 0){
          skipped++;
          return;
        }
        if(existingIds.has(id)) return; // 重複はスキップ(件数に含めない)
        validEntries.push({
          id, name, amount,
          category: validCatIds.has(e?.category) ? e.category : 'other',
          ts,
        });
      });

      const validFrequent = [];
      const existingFreq = new Set(data.frequent.map(f=>f.name));
      (Array.isArray(imported.frequent) ? imported.frequent : []).forEach(f=>{
        const name = typeof f?.name === 'string' ? f.name.trim().slice(0,40) : '';
        const amount = Number(f?.amount);
        if(!name || !Number.isFinite(amount) || amount <= 0) return;
        if(existingFreq.has(name)) return;
        existingFreq.add(name);
        validFrequent.push({
          name, amount,
          category: validCatIds.has(f?.category) ? f.category : 'other',
          count: Number.isFinite(Number(f?.count)) ? Number(f.count) : 0,
        });
      });

      if(imported.settings && Number.isFinite(Number(imported.settings.monthlyGoal)) && Number(imported.settings.monthlyGoal) > 0 && !data.settings.monthlyGoal){
        data.settings.monthlyGoal = Number(imported.settings.monthlyGoal);
      }

      data.entries = data.entries.concat(validEntries);
      data.frequent = data.frequent.concat(validFrequent);
      save();
      renderAll();
      showToast(skipped > 0 ? `${validEntries.length}件を読み込み(${skipped}件はスキップ)` : `${validEntries.length}件を読み込みました`);
    }catch(e){
      showToast('読み込みに失敗しました(ファイル形式を確認してください)');
    }
    ev.target.value = '';
  };
  reader.readAsText(file);
});

function resolvedMode(){
  const t = localStorage.getItem(THEME_KEY) || 'system';
  if(t === 'light' || t === 'dark') return t;
  try{
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  }catch(e){}
  return 'dark';
}

function applyPalette(){
  try{
    const id = localStorage.getItem(PALETTE_KEY) || 'gold';
    const p = (PALETTES[id] || PALETTES.gold)[resolvedMode()];
    const root = document.documentElement.style;
    root.setProperty('--bg', p.bg);
    root.setProperty('--bg-elevated', p.bgElevated);
    root.setProperty('--bg-card', p.bgCard);
    root.setProperty('--bg-card-hi', p.bgCardHi);
    root.setProperty('--border', p.border);
    root.setProperty('--bg-translucent', p.translucent);
    root.setProperty('--gold', p.gold);
    root.setProperty('--gold-bright', p.bright);
    root.setProperty('--gold-dim', p.dim);
  }catch(e){}
}

function applyTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY) || 'system';
    if(t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
  applyPalette();
}
document.getElementById('btnTheme').addEventListener('click', ()=>{
  const cur = localStorage.getItem(THEME_KEY) || 'system';
  const next = cur === 'system' ? 'dark' : (cur === 'dark' ? 'light' : 'system');
  localStorage.setItem(THEME_KEY, next);
  applyTheme();
  showToast(next === 'system' ? 'システム設定に合わせる' : (next === 'dark' ? 'ダークモード' : 'ライトモード'));
});
try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{
      if((localStorage.getItem(THEME_KEY) || 'system') === 'system') applyPalette();
    });
  }
}catch(e){}
document.getElementById('btnPalette').addEventListener('click', ()=>{
  const cur = localStorage.getItem(PALETTE_KEY) || 'gold';
  modalBody.innerHTML = `<h2>配色を選ぶ</h2><div class="swatch-grid" id="swatchGrid"></div>`;
  const grid = modalBody.querySelector('#swatchGrid');
  Object.entries(PALETTES).forEach(([id, p])=>{
    const b = document.createElement('button');
    b.className = 'swatch' + (id === cur ? ' sel' : '');
    b.innerHTML = `<span class="dot" style="background: conic-gradient(${p.dark.gold} 0deg 180deg, ${p.dark.bg} 180deg 360deg);"></span>${p.label}`;
    b.addEventListener('click', ()=>{
      localStorage.setItem(PALETTE_KEY, id);
      applyPalette();
      closeModal();
      showToast(`${p.label} にしました`);
    });
    grid.appendChild(b);
  });
  showModal();
});
try{ applyTheme(); }catch(e){}

/* ---------- tabs ---------- */
document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('view-record').classList.toggle('active', tab==='record');
    document.getElementById('view-stats').classList.toggle('active', tab==='stats');
    if(tab === 'stats') renderStats();
  });
});

function renderAll(){
  renderHero();
  renderChips();
  renderHistFilter();
  renderHistory();
  if(document.getElementById('view-stats').classList.contains('active')) renderStats();
}

renderAll();

/* ---------- service worker (offline support) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
